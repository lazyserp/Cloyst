services:
  # 1. Enterprise PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cloyst-db
    restart: always
    environment:
      POSTGRES_USER: cloyst
      POSTGRES_PASSWORD: cloyst_secure_password_2026
      POSTGRES_DB: cloyst
    ports:
      - "5432:5432"
    volumes:
      - cloyst_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloyst -d cloyst"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Cloyst Control Plane & Management Console
  control-plane:
    build: .
    container_name: cloyst-control-plane
    restart: always
    command: ["uvicorn", "core.control_plane.app:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: "postgresql://cloyst:cloyst_secure_password_2026@postgres:5432/cloyst"
      CLOYST_ADMIN_TOKEN: "cloyst-master-secret-2026"
      RUNNING_IN_DOCKER: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Cloyst AI Gateway (OpenAI-compatible inference proxy)
  gateway:
    build: .
    container_name: cloyst-gateway
    restart: always
    command: ["uvicorn", "core.gateway.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://cloyst:cloyst_secure_password_2026@postgres:5432/cloyst"
      RUNNING_IN_DOCKER: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cloyst_pgdata:

