name: Cloyst CI & Air-Gap Compliance Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov coverage pyyaml

      - name: Run Full Test Suite with Coverage
        run: |
          pytest --cov=core --cov-report=term --cov-report=xml

      - name: Run Air-Gap Failover Demo
        run: |
          python scripts/airgap_demo.py

      - name: Run Performance Benchmark Smoke Test
        run: |
          python benchmarks/run_benchmark.py

      - name: Verify Audit Log Integrity via CLI
        run: |
          python -m core.cli audit verify
